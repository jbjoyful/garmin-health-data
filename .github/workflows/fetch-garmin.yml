name: fetch-garmin

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Amsterdam in winter, 08:00 in summer
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch (ending yesterday)"
        default: "14"

permissions:
  contents: write

concurrency:
  group: fetch-garmin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Garmin Personal API client
        run: python -m pip install garmin-connect-personal-api-python
      - name: Fetch data
        id: fetch
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python scripts/fetch.py --days "${{ github.event.inputs.days || '3' }}"
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "garmin-bot"
          git config user.email "garmin-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
      - name: Fail the run if the fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Garmin fetch failed, see data/runs.csv" >&2
          exit 1
